<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso bloqueado</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #00a884; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; overflow: hidden;
           font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; color: #111b21; }
    .d { position: absolute; border-radius: 50%; background: #fff; opacity: .08; }
    .tarjeta { position: relative; width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 30px 28px; }
    .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo { width: 42px; height: 42px; border-radius: 12px; background: #00a884; color: #fff; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .marca b { display: block; font-size: 18px; font-weight: 600; }
    .marca small { color: #667781; font-size: 13px; }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    p { margin: 0 0 20px; color: #667781; font-size: 14px; line-height: 1.5; }
    strong { color: #111b21; font-variant-numeric: tabular-nums; }
    a { display: block; text-align: center; background: #111b21; color: #fff; border-radius: 10px; padding: 11px; font-weight: 600; text-decoration: none; }
    a:hover { background: #2a3942; }
  </style>
</head>
<body>
  <div class="d" style="width:340px;height:340px;left:-110px;top:-120px"></div>
  <div class="d" style="width:260px;height:260px;right:-70px;bottom:-90px"></div>
  <div class="d" style="width:110px;height:110px;right:14%;top:8%"></div>
  <div class="tarjeta">
    <div class="marca"><div class="logo">P</div><div><b>Panel</b><small>Atención al cliente</small></div></div>
    <h1>Acceso bloqueado temporalmente</h1>
    <p id="mensaje">Hubo demasiados intentos fallidos con este usuario. Por seguridad, podrá intentar de nuevo en <strong id="resta" data-hasta="{{ hasta }}">{{ tiempo }}</strong>.</p>
    <a href="{% url 'login' %}">Volver al inicio de sesión</a>
  </div>
  <script>
    const resta = document.getElementById('resta'), hasta = new Date(resta.dataset.hasta);
    const dos = (n) => String(n).padStart(2, '0');
    const pintar = () => {
      const s = Math.max(0, Math.ceil((hasta - Date.now()) / 1000));
      if (s === 0) {
        clearInterval(reloj);
        document.getElementById('mensaje').textContent = 'El bloqueo terminó. Ya puede intentar de nuevo.';
        return;
      }
      const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
      resta.textContent = `${h ? h + ' h ' + dos(m) : m} min ${dos(s % 60)} s`;
    };
    const reloj = setInterval(pintar, 1000);
    pintar();
  </script>
</body>
</html>
