<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Chats{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f0f2f5; color: #111; }
    header { background: #075e54; color: #fff; padding: .8rem 1rem; display: flex; gap: 1rem; align-items: center; }
    header a { color: #fff; text-decoration: none; }
    main { max-width: 720px; margin: 0 auto; padding: 1rem; }
    .fila { display: block; background: #fff; padding: .8rem 1rem; border-bottom: 1px solid #eee; color: inherit; text-decoration: none; }
    .fila small { color: #667; }
    #mensajes { background: #efeae2; padding: 1rem; height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: .4rem; }
    .burbuja { max-width: 75%; padding: .4rem .7rem; border-radius: 8px; background: #fff; white-space: pre-wrap; }
    .burbuja.out { align-self: flex-end; background: #d9fdd3; }
    .burbuja small { display: block; color: #667; font-size: .7rem; text-align: right; }
    .aviso { padding: .6rem 1rem; margin-bottom: .5rem; border-radius: 6px; background: #fff3cd; }
    .aviso.ok { background: #d1f2e0; }
    .error { color: #b00020; padding: .3rem 0; }
    form.enviar { display: flex; gap: .5rem; margin-top: .5rem; }
    form.enviar textarea { flex: 1; padding: .5rem; font: inherit; }
    button { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'lista_chats' %}"><strong>Chats</strong></a>
    <a href="{% url 'enviar_plantilla' %}">Enviar plantilla</a>
    <a href="/admin/">Admin</a>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
