<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar plantilla</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; padding: .6rem 1.2rem; }
    .ok { color: #0a7d32; } .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Enviar plantilla «pedido_confirmado»</h1>
  {% if ok %}<p class="ok">{{ ok }}</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Teléfono (formato internacional)<input name="telefono" value="{{ datos.telefono }}" placeholder="+56912345678" required></label>
    <label>Nombre del cliente<input name="nombre" value="{{ datos.nombre }}" required></label>
    <label>N.º de pedido<input name="pedido" value="{{ datos.pedido }}" placeholder="#1024" required></label>
    <label>Fecha de entrega<input name="fecha" value="{{ datos.fecha }}" placeholder="3 de octubre" required></label>
    <button type="submit">Enviar</button>
  </form>
</body>
</html>
