{% extends 'chats/base.html' %}
{% block titulo %}{{ contacto }}{% endblock %}
{% block contenido %}
<h2>{{ contacto }} <small>{{ contacto.telefono }}</small></h2>
<div id="panel" hx-get="{% url 'chat_mensajes' contacto.pk %}" hx-trigger="every 3s" hx-swap="innerHTML">
  {% include 'chats/_mensajes.html' %}
</div>
<form class="enviar" hx-post="{% url 'chat_enviar' contacto.pk %}" hx-target="#panel" hx-swap="innerHTML"
      hx-on::after-request="this.reset()">
  {% csrf_token %}
  <textarea name="texto" rows="2" placeholder="Escribe una respuesta…" required></textarea>
  <button type="submit">Enviar</button>
</form>
<script>
  const bajar = () => { const m = document.getElementById('mensajes'); if (m) m.scrollTop = m.scrollHeight; };
  bajar();
  document.body.addEventListener('htmx:afterSwap', bajar);
</script>
{% endblock %}
